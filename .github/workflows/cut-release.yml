name: Cut a release

# Publishing from a laptop means the installers are whatever that laptop had on it.
# This does the whole thing on GitHub: set the version, move the changelog's Unreleased
# section under it, commit, tag, push — and pushing the tag starts Release, which builds
# Windows, both Macs and Linux and attaches them to one draft.
#
# Actions → Cut a release → Run workflow → type the version.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, like 0.4.0'
        required: true
      dry_run:
        description: 'Only show what would change'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write # to ask Release for the installers once the tag is pushed

concurrency:
  group: cut-release
  cancel-in-progress: false

jobs:
  cut:
    name: Version, changelog, tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Cargo.lock carries the version too, and a stale one fails `cargo check --locked`
      # on the commit this makes. The release script needs cargo present to fix it.
      - uses: dtolnay/rust-toolchain@stable

      - name: Refuse a version that is already out
        run: |
          v="${{ inputs.version }}"
          if [ -z "$(echo "$v" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$')" ]; then
            echo "$v is not a version like 0.4.0"; exit 1
          fi
          if git rev-parse "v$v" >/dev/null 2>&1; then
            echo "v$v already exists"; exit 1
          fi

      - name: Is there anything to release?
        run: |
          node -e "
            const fs = require('fs');
            const md = fs.readFileSync('CHANGELOG.md', 'utf8');
            const m = md.match(/## \[Unreleased\]\n([\s\S]*?)(\n## \[|$)/);
            const body = (m ? m[1] : '').replace(/^###.*$/gm, '').trim();
            if (!body) { console.error('The Unreleased section is empty; nothing to release.'); process.exit(1); }
            console.log('Unreleased holds ' + body.split('\n').filter((l) => l.startsWith('- ')).length + ' entries.');
          "

      - name: Set the version and move the changelog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm run release -- "${{ inputs.version }}"
          echo "--- what the release page will say ---"
          node scripts/release-notes.mjs "${{ inputs.version }}"

      - name: Show it, or push it
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "--- dry run: nothing pushed ---"
            git --no-pager show --stat HEAD
            exit 0
          fi
          git push origin HEAD:${{ github.ref_name }}
          git push origin "v${{ inputs.version }}"
          echo "Pushed v${{ inputs.version }}."

      # A tag pushed with GITHUB_TOKEN does not start anything: GitHub suppresses
      # workflow triggers from its own token so a workflow cannot loop for ever. So
      # Release is asked for by name, which is allowed.
      - name: Build the installers
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run release.yml --ref ${{ github.ref_name }} -f tag="v${{ inputs.version }}"
          echo "Release is building Windows, both Macs and Linux into a draft."
